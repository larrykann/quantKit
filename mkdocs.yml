site_name: quantKit
repo_url: https://github.com/larrykann/quantKit

theme:
  name: material
  font: false
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: sakura
      primary: custom
      accent: custom
      toggle:
        icon: material/brightness-7
        name: Switch to dark mode
    
    - media: "(prefers-color-scheme: dark)"
      scheme: aizome
      primary: custom
      accent: custom
      toggle:
        icon: material/brightness-4
        name: Switch to light mode

extra_css:
  - stylesheets/extra.css
  - https://unpkg.com/katex@0/dist/katex.min.css

markdown_extensions:
  - pymdownx.arithmatex:
      generic: true

extra_javascript:
  - javascript/katex.js
  - https://unpkg.com/katex@0/dist/katex.min.js
  - https://unpkg.com/katex@0/dist/contrib/auto-render.min.js

nav:
  - Home: index.md
  - Getting Started:
    - Installation: getting-started/installation.md
    - Quickstart: getting-started/quickstart.md
  - User Guide:
    - Importing Data: user-guide/importing-data.md
    - Binary Files: user-guide/working-with-binary-files.md
    - Strategies: user-guide/strategies.md
  - Technical Guides:
    - Binary Format Specification: technical-guides/binary-format-spec.md
    - Datetime Deepdive: technical-guides/datetime-deepdive.md
    - Performance Tips: technical-guides/performance-tips.md
  - Mathematical Foundations:
    - Overview: foundations/index.md
    - Finance:
      - Overview: foundations/finance/index.md
      - Returns:
        - Simple Returns: foundations/finance/simple-returns.md
        - Logarithmic Returns: foundations/finance/logarithmic-returns.md
        - Multiperiod Simple Returns: foundations/finance/multiperiod-simple-returns.md
      - Interest:
        - Simple Interest: foundations/finance/simple-interest.md
        - Discrete Compound Interest: foundations/finance/discrete-compound-interest.md
        - Continuous Compound Interest: foundations/finance/continuous-compound-interest.md
    - Probability:
      - Overview: foundations/probability/index.md
      - Random Expirements: foundations/probability/random-experiments.md
      - Sample Space: foundations/probability/sample-space.md
      - Events: foundations/probability/events.md
      - Probability Definitions:
        - Classical Definition: foundations/probability/classical-definition.md
        - Limiting Ratio Definition: foundations/probability/limiting-ratio-definition.md
        - Practical Estimation: foundations/probability/practical-estimation.md
      - Random Variables: 
        - Overview: foundations/probability/random-variables.md
        - Discrete Random Variables: foundations/probability/discrete-random-variables.md
        - Continuous Random Variables: foundations/probability/continuous-random-variables.md
      - Probability Functions:
        - Probability Mass Function: foundations/probability/pmf.md
        - Probability Density Function: foundations/probability/pdf.md
        - Cumulative Distribution Function: foundations/probability/cdf.md
  - API Reference:
    - Data:
      - Schemas: reference/data/quantKit.data.schemas.md
    - Financial:
      - Interest: reference/financial/quantKit.financial.interest.md
      - Returns: reference/financial/quantKit.financial.returns.md
    - Stochastic:
      - Utils: reference/stochastic/quantKit.stochastic.utils.md
plugins:
  - search
  - mkdocstrings:
      handlers:
        python:
          paths:
            - src
